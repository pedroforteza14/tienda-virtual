<title>THE GUION Radar</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600..800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Una sola columna de fichas, ordenadas por comentarios. Cada ficha: link, comentarios, guion. */
:root{
  --bg:#EFF2F5; --panel:#FFFFFF; --panel-2:#F7F9FB;
  --fg:#141A22; --muted:#5A6675; --line:#D5DBE3;
  --accent:#1B4FD8; --accent-soft:#E4EAFB;
  --hot:#D9503F; --hot-soft:#FBE7E4;
  --sans:"IBM Plex Sans",system-ui,-apple-system,Segoe UI,sans-serif;
  --display:"Bricolage Grotesque","IBM Plex Sans",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F141B; --panel:#161D26; --panel-2:#1B232E;
  --fg:#E7ECF2; --muted:#8D9AAB; --line:#28323E;
  --accent:#7297FF; --accent-soft:#1D2740;
  --hot:#FF8A79; --hot-soft:#3A2220;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0F141B; --panel:#161D26; --panel-2:#1B232E;
  --fg:#E7ECF2; --muted:#8D9AAB; --line:#28323E;
  --accent:#7297FF; --accent-soft:#1D2740;
  --hot:#FF8A79; --hot-soft:#3A2220;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.5;margin:0}
.wrap{max-width:860px;margin:0 auto;padding-inline:16px;padding-block:0 56px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);
  border-bottom:1px solid var(--line);padding-block:13px;display:flex;flex-wrap:wrap;
  gap:10px;align-items:baseline;justify-content:space-between}
.brand{display:flex;align-items:baseline;gap:9px;min-width:0}
.brand b{font-family:var(--display);font-weight:800;font-size:1.25rem;letter-spacing:-.02em}
.brand span{font-family:var(--mono);font-size:.67rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
select,input,textarea{font:inherit;background:var(--panel);color:var(--fg);
  border:1px solid var(--line);border-radius:7px;padding:8px 10px;max-width:100%}
textarea{font-family:var(--mono);font-size:.85rem;line-height:1.6;resize:vertical;width:100%}
.wkrow{display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:.76rem;color:var(--muted)}

/* ---- ficha ---- */
.fichas{display:flex;flex-direction:column;gap:14px;margin-top:22px}
.ficha{background:var(--panel);border:1px solid var(--line);border-radius:13px;overflow:hidden}
.ficha.lider{border-color:var(--hot)}
.cab{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;
  padding:14px 16px;border-bottom:1px solid var(--line);background:var(--panel-2)}
.izq{display:flex;align-items:center;gap:13px;min-width:0;flex:1 1 auto}
.puesto{font-family:var(--display);font-weight:700;font-size:1.1rem;color:var(--muted);
  width:26px;flex:0 0 auto;text-align:center}
.ficha.lider .puesto{color:var(--hot)}
.coment{flex:0 0 auto;text-align:center;min-width:76px}
.coment b{display:block;font-family:var(--display);font-weight:700;font-size:1.6rem;
  line-height:1.05;font-variant-numeric:tabular-nums}
.coment i{display:block;font-family:var(--mono);font-size:.6rem;text-transform:uppercase;
  letter-spacing:.1em;color:var(--muted);font-style:normal;margin-top:2px}
.coment.vacio b{color:var(--muted);font-size:1.2rem}
.quien{min-width:0}
.quien .gancho{font-weight:500;overflow-wrap:anywhere}
.quien .cuenta{font-family:var(--mono);font-size:.76rem;color:var(--muted);margin-top:2px}
.acc{display:flex;gap:7px;flex-wrap:wrap;flex:0 0 auto}
.btn{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:8px 14px;font-weight:600;
  text-decoration:none;display:inline-block}
.btn.sec{background:var(--panel);color:var(--fg);border:1px solid var(--line)}
.btn.sm{padding:5px 11px;font-size:.81rem;font-weight:500}
.btn:disabled{opacity:.5;cursor:not-allowed}
.cuerpo{padding:14px 16px}
.rot{font-family:var(--mono);font-size:.63rem;text-transform:uppercase;letter-spacing:.13em;
  color:var(--muted);margin-bottom:7px}
.guion{font-family:var(--mono);font-size:.84rem;line-height:1.65;white-space:pre-wrap;
  overflow-wrap:anywhere;margin:0}
.singuion{color:var(--muted);font-size:.89rem}
.pie{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-top:12px}
.nota{font-size:.78rem;color:var(--muted)}

/* ---- vacio y carga ---- */
.vacio{border:1px dashed var(--line);border-radius:13px;padding:28px 18px;text-align:center;color:var(--muted);margin-top:22px}
.vacio b{display:block;color:var(--fg);font-family:var(--display);font-size:1.08rem;margin-bottom:6px}
.alta{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:16px;margin-top:26px}
.alta h2{font-size:1.02rem;margin-bottom:4px}
.campos{display:grid;grid-template-columns:1fr;gap:10px;margin-top:13px}
@media (min-width:620px){.campos{grid-template-columns:1fr 130px 180px auto;align-items:end}}
.campo{display:flex;flex-direction:column;gap:4px;min-width:0}
.campo label{font-size:.79rem;font-weight:500}
.msg{font-size:.81rem;color:var(--muted);margin-top:9px;min-height:1.2em}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand"><b>THE GUION</b><span>Radar</span></div>
    <div class="wkrow">
      <label for="selSemana">semana</label>
      <select id="selSemana"><option value="">—</option></select>
    </div>
  </header>

  <div id="lista"></div>

  <section class="alta">
    <h2>Agregar un video</h2>
    <p class="nota">Pegá el link del reel y la cantidad de comentarios que tiene en Instagram.
      Después pedime el guión en el chat y aparece acá.</p>
    <div class="campos">
      <div class="campo">
        <label for="fUrl">Link del reel</label>
        <input id="fUrl" type="url" placeholder="https://www.instagram.com/reel/...">
      </div>
      <div class="campo">
        <label for="fCom">Comentarios</label>
        <input id="fCom" type="number" min="0" placeholder="340">
      </div>
      <div class="campo">
        <label for="fCuenta">Cuenta</label>
        <input id="fCuenta" list="cuentasConocidas" placeholder="handle sin @">
        <datalist id="cuentasConocidas">
          <option value="nico.donovann"></option>
          <option value="bruno.dbenedetto"></option>
        </datalist>
      </div>
      <div class="campo">
        <label for="btnAlta" style="visibility:hidden">Acción</label>
        <button class="btn" id="btnAlta">Agregar</button>
      </div>
    </div>
    <p class="msg" id="msgAlta"></p>
  </section>
</div>

<script>
const S = { db:null, sample:null, posts:[], guiones:[], semana:"", cargando:true };
const $ = s => document.querySelector(s);
const num = n => (Number(n)||0).toLocaleString("es-AR");
const esc = s => String(s??"");
const idCorto = () => Math.random().toString(36).slice(2,10);

function isoSemana(f){
  const d = new Date(Date.UTC(f.getUTCFullYear(), f.getUTCMonth(), f.getUTCDate()));
  const dow = d.getUTCDay() || 7;
  d.setUTCDate(d.getUTCDate() + 4 - dow);
  const a = d.getUTCFullYear();
  const n = Math.ceil(((d - new Date(Date.UTC(a,0,1)))/86400000 + 1)/7);
  return a + "-W" + String(n).padStart(2,"0");
}

/* El handle no viene en un link de reel, pero sí en instagram.com/usuario/reel/... */
const RESERVADAS = new Set(["p","reel","reels","tv","stories","explore","s"]);
function cuentaDeUrl(u){
  const m = String(u||"").match(/instagram\.com\/([^\/?#]+)/i);
  if(!m) return "";
  const seg = m[1].toLowerCase();
  return RESERVADAS.has(seg) ? "" : m[1];
}

/* Primera línea útil del guión: sirve para reconocer la ficha de un vistazo. */
function ganchoDe(texto){
  const t = String(texto||"");
  const m = t.match(/GANCHO[^\n]*\n([^\n]+)/);
  if(m) return m[1].trim();
  const l = t.split("\n").map(x=>x.trim()).filter(Boolean);
  return l[0] || "";
}

const guionDe = id => S.guiones.find(g=>g.postId===id);
const delaSemana = () => S.posts.filter(p=>p.semana===S.semana)
  .sort((a,b)=>(Number(b.comentarios)||0)-(Number(a.comentarios)||0));

function pintarSemanas(){
  const sel = $("#selSemana");
  const ws = [...new Set(S.posts.map(p=>p.semana).filter(Boolean))].sort().reverse();
  const prev = S.semana;
  sel.innerHTML = "";
  if(!ws.length){
    sel.append(Object.assign(document.createElement("option"),{value:"",textContent:"sin datos"}));
    S.semana = ""; return;
  }
  ws.forEach(w=>sel.append(Object.assign(document.createElement("option"),{value:w,textContent:w})));
  S.semana = ws.includes(prev) ? prev : ws[0];
  sel.value = S.semana;
}

function pintar(){
  pintarSemanas();
  const cont = $("#lista");
  cont.innerHTML = "";
  const ps = delaSemana();

  if(!ps.length){
    const v = document.createElement("div"); v.className = "vacio";
    const b = document.createElement("b");
    b.textContent = S.cargando ? "Cargando…" : "Todavía no hay videos cargados";
    const p = document.createElement("p");
    p.textContent = S.cargando ? "Un segundo."
      : "Agregá abajo el link de un reel y sus comentarios. Las fichas se ordenan solas, del más comentado al menos.";
    v.append(b,p); cont.append(v); return;
  }

  const fichas = document.createElement("div"); fichas.className = "fichas";

  ps.forEach((p,i)=>{
    const g = guionDe(p.id);
    const art = document.createElement("article");
    art.className = "ficha" + (i===0 && Number(p.comentarios)>0 ? " lider" : "");

    /* --- cabecera: puesto, comentarios, gancho, link --- */
    const cab = document.createElement("div"); cab.className = "cab";
    const izq = document.createElement("div"); izq.className = "izq";

    const pu = document.createElement("div"); pu.className = "puesto"; pu.textContent = String(i+1);

    const co = document.createElement("div");
    const tiene = Number(p.comentarios) > 0;
    co.className = "coment" + (tiene ? "" : " vacio");
    const cb = document.createElement("b"); cb.textContent = tiene ? num(p.comentarios) : "—";
    const ci = document.createElement("i"); ci.textContent = tiene ? "comentarios" : "sin cargar";
    co.append(cb,ci);

    const qu = document.createElement("div"); qu.className = "quien";
    const ga = document.createElement("div"); ga.className = "gancho";
    ga.textContent = g ? ganchoDe(g.texto) : (esc(p.tema) || "Sin guión todavía");
    const cu = document.createElement("div"); cu.className = "cuenta"; cu.textContent = "@"+esc(p.handle);
    qu.append(ga,cu);

    izq.append(pu,co,qu);

    const acc = document.createElement("div"); acc.className = "acc";
    if(p.url){
      const a = document.createElement("a");
      a.className = "btn sec sm"; a.href = p.url; a.target = "_blank"; a.rel = "noopener";
      a.textContent = "Ver el video";
      acc.append(a);
    }
    cab.append(izq,acc);

    /* --- cuerpo: mi guión --- */
    const cue = document.createElement("div"); cue.className = "cuerpo";
    const rot = document.createElement("div"); rot.className = "rot"; rot.textContent = "Mi guión readaptado";
    cue.append(rot);

    const pre = document.createElement("pre"); pre.className = "guion";
    const sin = document.createElement("p"); sin.className = "singuion";
    if(g){ pre.textContent = g.texto; cue.append(pre); }
    else {
      sin.textContent = "Todavía no hay guión para este video. Pedímelo en el chat, o usá el botón de abajo.";
      cue.append(sin);
    }

    const pie = document.createElement("div"); pie.className = "pie";
    const msg = document.createElement("span"); msg.className = "nota";

    if(g){
      const bc = document.createElement("button"); bc.className = "btn sm"; bc.textContent = "Copiar guión";
      bc.addEventListener("click", async ()=>{
        try{
          await navigator.clipboard.writeText(g.texto);
          msg.textContent = "Copiado.";
        }catch{
          const r = document.createRange(); r.selectNodeContents(pre);
          const s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
          msg.textContent = "Seleccionado: copialo con el teclado.";
        }
      });
      pie.append(bc);
    }

    if(S.sample){
      const br = document.createElement("button");
      br.className = "btn sec sm"; br.textContent = g ? "Rehacer" : "Escribir guión";
      br.addEventListener("click", ()=>reescribir(p, pre, sin, cue, br, msg));
      pie.append(br);
    }
    pie.append(msg);
    cue.append(pie);

    art.append(cab,cue);
    fichas.append(art);
  });

  cont.append(fichas);
}

/* ---------- reescritura ---------- */
function prompt_(p){
  const base = [esc(p.hook), esc(p.transcripcion), esc(p.caption), esc(p.tema)].filter(Boolean).join("\n\n");
  return [
"Sos el guionista de THE GUION, cuenta de Instagram sobre Meta Ads en español rioplatense (voseo: usá \"vos\", \"tenés\", \"mirá\").",
"Te paso una pieza ajena que funcionó y tenés que escribir un reel NUEVO para THE GUION, no una copia.",
"",
"PIEZA ORIGINAL (de @"+esc(p.handle)+(Number(p.comentarios)?", "+num(p.comentarios)+" comentarios":"")+")",
base || "(solo se conoce la cuenta y el link; deducí el tema del nicho Meta Ads)",
"",
"REGLAS, OBLIGATORIAS",
"1. Conservá la estructura psicológica del gancho, nunca las palabras.",
"2. Cambiá el vehículo: si el original usa un caso, usá un dato; si usa un dato, usá una objeción real.",
"3. Cambiá el enemigo: mismo tema, otro culpable.",
"4. El ángulo de THE GUION es lo que se DICE en el anuncio, no cómo se configura la plataforma.",
"5. Ninguna secuencia de 6 palabras puede coincidir con el original.",
"6. No inventes resultados, cifras, casos ni clientes. Si falta un dato propio, escribí [ACÁ VA TU NÚMERO].",
"7. El cierre pide un comentario con una palabra clave en mayúsculas.",
"",
"FORMATO DE SALIDA, solo texto plano con estos títulos:",
"GANCHO (0-3s)","DESARROLLO (con los segundos entre corchetes)","CIERRE"
  ].join("\n");
}

async function reescribir(p, pre, sin, cue, boton, msg){
  if(!S.sample) return;
  boton.disabled = true; msg.textContent = "Pensando…";
  if(sin.isConnected) sin.replaceWith(pre);
  pre.textContent = "";
  try{
    const { text } = await S.sample(prompt_(p), {
      cache:false,
      onText: ({text})=>{ pre.textContent = text; msg.textContent = ""; }
    });
    if(S.db){
      const g = guionDe(p.id);
      const id = g ? g.id : (p.id + "-" + idCorto());
      await S.db.doc("guiones/"+id).set({
        postId:p.id, semana:p.semana, handle:p.handle, texto:text,
        actualizado:new Date().toISOString()
      });
      msg.textContent = "Guardado.";
    } else {
      msg.textContent = "Escrito, pero no se pudo guardar.";
    }
  }catch(e){
    if(e.code === "not_granted" || e.code === "sampling_disabled"){
      msg.textContent = "No autorizaste a este tablero a usar Claude.";
    } else if(e.code === "rate_limited"){
      msg.textContent = "Demasiados pedidos seguidos. Probá en un rato.";
    } else {
      pre.textContent = e.text || "";
      msg.textContent = "Se cortó. Reintentá cuando quieras.";
    }
  }finally{ boton.disabled = false; }
}

/* ---------- alta ---------- */
$("#fUrl").addEventListener("change", ()=>{
  const h = cuentaDeUrl($("#fUrl").value);
  if(h && !$("#fCuenta").value) $("#fCuenta").value = h;
});

$("#btnAlta").addEventListener("click", async ()=>{
  const msg = $("#msgAlta");
  const url = $("#fUrl").value.trim();
  const com = $("#fCom").value.trim();
  const cuenta = $("#fCuenta").value.trim().replace(/^@/,"") || cuentaDeUrl(url);
  if(!url){ msg.textContent = "Falta el link del reel."; return; }
  if(!cuenta){ msg.textContent = "Poné de qué cuenta es: el link de un reel no lo dice."; return; }
  if(!S.db){ msg.textContent = "Sin conexión al guardado."; return; }
  $("#btnAlta").disabled = true; msg.textContent = "Guardando…";
  try{
    await S.db.doc("posts/"+idCorto()).set({
      handle:cuenta, url, comentarios:Number(com)||0,
      semana:isoSemana(new Date()), fecha:"", likes:0, vistas:0,
      tema:"", hook:"", transcripcion:"", caption:"",
      origen:"manual", cargado:new Date().toISOString()
    });
    msg.textContent = "Agregado. Pedime el guión en el chat.";
    $("#fUrl").value = ""; $("#fCom").value = ""; $("#fCuenta").value = "";
  }catch(e){
    msg.textContent = (e.code === "invalid_argument")
      ? "No tenés permiso de escritura en este tablero." : "No se pudo guardar. Reintentá.";
  }finally{ $("#btnAlta").disabled = false; }
});

$("#selSemana").addEventListener("change", e=>{ S.semana = e.target.value; pintar(); });

/* primer frame */
pintar();

(async ()=>{
  const db = await claude.use("db");
  if(!db){ S.cargando = false; pintar(); return; }
  S.db = db;
  db.collection("posts").onSnapshot(s=>{
    S.posts = s.docs.map(d=>({id:d.id, ...d.data()}));
    S.cargando = false; pintar();
  }, e=>{ S.cargando = false; pintar(); });
  db.collection("guiones").onSnapshot(s=>{
    S.guiones = s.docs.map(d=>({id:d.id, ...d.data()}));
    pintar();
  });
})();

(async ()=>{ S.sample = await claude.use("sample"); pintar(); })();
</script>
